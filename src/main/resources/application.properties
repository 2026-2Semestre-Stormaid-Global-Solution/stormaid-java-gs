spring.application.name=stormaid

# Configuração da Base de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:stormaiddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desativar Flyway temporariamente (o H2 cria as tabelas automaticamente)
spring.flyway.enabled=false

# Consola H2 web (opcional para visualizar a BD em http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Chave secreta do JWT
api.security.token.secret=stormaid-secret-key-super-segura-2026