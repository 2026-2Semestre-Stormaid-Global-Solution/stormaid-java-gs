spring.application.name=stormaid-api

# BANCO DE DADOS ORACLE
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# SWAGGER / SPRINGDOC CONFIGURAÇÕES EXPLICITAS
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# SERVIDOR
server.port=${PORT:8080}
server.error.include-stacktrace=never

# POOL DE CONEXÕES HIKARI
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# CONFIGURAÇÃO DE SEGURANÇA JWT
api.security.token.secret=${JWT_SECRET:sua_chave_jwt_super_segura_aqui}

spring.ai.openai.api-key=ten${API_KEY}